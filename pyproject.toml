[project]
name = "guitar-chord-coach"
version = "0.1.0"
description = "Upload a song and practise the detected guitar chords"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.0.1",
    "fastapi>=0.139.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.0",
    "imageio-ffmpeg>=0.6.0",
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "uvicorn[standard]>=0.51.0",
    "yt-dlp>=2026.7.4",
]
